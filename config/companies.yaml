# Employers whose own job boards lane ② polls daily. Public posting APIs only, no keys.
#   ats:       greenhouse | lever | ashby   (find new ones with `ainews jobs-probe <slug> …`)
#   board:     the slug in the board's URL
#   ai_native: an AI company; its solutions, research and "technical staff" roles count as AI roles.
#              Set false for other tech companies: there only titles that name AI or ML count.
#   region:    eu for Lever's EU instance
# Probed 2026-10-12. Workday, SuccessFactors and the other enterprise boards (banks, pharma, NVIDIA)
# come in a later step; see docs/job-sources-markets.md.

